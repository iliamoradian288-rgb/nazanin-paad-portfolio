<script>
var LANG='en';try{LANG=localStorage.getItem('np-lang')||'en';}catch(e){}
function setLang(l){LANG=l;try{localStorage.setItem('np-lang',l);}catch(e){}document.documentElement.lang=l;document.querySelectorAll('[data-en]').forEach(function(e){e.innerHTML=e.dataset[l];});document.getElementById('b-en').classList.toggle('on',l==='en');document.getElementById('b-es').classList.toggle('on',l==='es');}

var PHOTOS=['assets/projects/velenjak3/01.jpg','assets/projects/velenjak3/02.jpg','assets/projects/velenjak3/03.jpg'];var LI=0;
function lbOpen(i){LI=i;document.getElementById('lbimg').src=PHOTOS[i];document.getElementById('lb').hidden=false;}
function lbClose(){document.getElementById('lb').hidden=true;}
function lbStep(d){LI=(LI+d+PHOTOS.length)%PHOTOS.length;document.getElementById('lbimg').src=PHOTOS[LI];}
